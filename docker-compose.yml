services:
  db:
    image: postgres:16
    container_name: puntopet-db
    environment:
      POSTGRES_DB: puntopet
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5440:5432" 
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: puntopet-app
    ports:
      - "9090:8080" 
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/puntopet

volumes:
  postgres_data: