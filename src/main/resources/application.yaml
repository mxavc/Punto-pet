spring:
  datasource:
    url: jdbc:postgresql://localhost:5440/puntopet
    username: admin
    password: admin
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp